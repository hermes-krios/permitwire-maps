const CITIES = [{"name":"Carlsbad","latitude":32.4207,"longitude":-104.2288},{"name":"Artesia","latitude":32.8423,"longitude":-104.4033},{"name":"Roswell","latitude":33.3943,"longitude":-104.523},{"name":"Hobbs","latitude":32.7026,"longitude":-103.136},{"name":"Lovington","latitude":32.944,"longitude":-103.3485},{"name":"Jal","latitude":32.1132,"longitude":-103.1935},{"name":"Eunice","latitude":32.4373,"longitude":-103.1591},{"name":"Loving","latitude":32.2862,"longitude":-104.0958},{"name":"Malaga","latitude":32.2232,"longitude":-104.0691},{"name":"Monument","latitude":32.624,"longitude":-103.2644},{"name":"Tatum","latitude":33.2554,"longitude":-103.3166},{"name":"Carlsbad Caverns","latitude":32.1479,"longitude":-104.5567},{"name":"Alamogordo","latitude":32.8995,"longitude":-105.9603},{"name":"Las Cruces","latitude":32.3199,"longitude":-106.7637},{"name":"Ruidoso","latitude":33.3317,"longitude":-105.673},{"name":"Clovis","latitude":34.4048,"longitude":-103.2052},{"name":"Portales","latitude":34.1862,"longitude":-103.3344},{"name":"Tucumcari","latitude":35.1717,"longitude":-103.725},{"name":"Albuquerque","latitude":35.0844,"longitude":-106.6504},{"name":"Santa Fe","latitude":35.687,"longitude":-105.9378},{"name":"Farmington","latitude":36.7281,"longitude":-108.2187},{"name":"Bloomfield","latitude":36.7111,"longitude":-107.9845},{"name":"Aztec","latitude":36.8222,"longitude":-107.9928}];
const PIN_ZOOM = 11;
const FED = '#f59e0b';
const FEE = '#38bdf8';
const HEX_FILL = {1:'#38bdf8', 2:'#fbbf24', 5:'#f97316', 10:'#ef4444', 20:'#7f1d1d'};
window.__pwReady = false;

function hexColor(n) {
  if (n >= 20) return HEX_FILL[20];
  if (n >= 10) return HEX_FILL[10];
  if (n >= 5) return HEX_FILL[5];
  if (n >= 2) return HEX_FILL[2];
  return HEX_FILL[1];
}
function ptsOf(key) { return (DATA[key] && DATA[key].points) || []; }
function quantile(arr, q) {
  const a = arr.slice().sort(function(x, y) { return x - y; });
  if (!a.length) return 0;
  const i = (a.length - 1) * q;
  const lo = Math.floor(i), hi = Math.ceil(i);
  if (lo === hi) return a[lo];
  return a[lo] * (hi - i) + a[hi] * (i - lo);
}
function clusterBounds(pts) {
  if (!pts.length) return null;
  if (pts.length < 8) {
    return L.latLngBounds(pts.map(function(p) { return [p.latitude, p.longitude]; })).pad(0.2);
  }
  const lats = pts.map(function(p) { return p.latitude; });
  const lons = pts.map(function(p) { return p.longitude; });
  return L.latLngBounds(
    [quantile(lats, 0.02), quantile(lons, 0.02)],
    [quantile(lats, 0.98), quantile(lons, 0.98)]
  ).pad(0.12);
}
function allBounds(pts) {
  if (!pts.length) return null;
  return L.latLngBounds(pts.map(function(p) { return [p.latitude, p.longitude]; })).pad(0.08);
}
function popupHtml(p) {
  const name = p.well_name || p.api || 'Well';
  const kind = p.federal ? 'Federal / Indian' : (p.land || 'State / Private');
  return '<div><b>' + name + '</b>'
    + (p.operator ? '<div class=op>' + p.operator + '</div>' : '')
    + '<div>' + kind + (p.county ? ' · ' + p.county + ' County' : '') + '</div>'
    + (p.approved ? '<div>Approved ' + p.approved + '</div>' : '')
    + (p.api ? '<div>API ' + p.api + '</div>' : '')
    + '<div>' + p.latitude.toFixed(5) + ', ' + p.longitude.toFixed(5) + '</div></div>';
}
function hexSize(z) {
  if (!Number.isFinite(z)) return 0.045;
  if (z <= 6) return 0.08;
  if (z <= 8) return 0.045;
  return 0.025;
}
function axialRound(q, r) {
  let x = q, z = r, y = -x - z;
  let rx = Math.round(x), ry = Math.round(y), rz = Math.round(z);
  const xd = Math.abs(rx - x), yd = Math.abs(ry - y), zd = Math.abs(rz - z);
  if (xd > yd && xd > zd) rx = -ry - rz;
  else if (yd > zd) ry = -rx - rz;
  else rz = -rx - ry;
  return [rx, rz];
}
function lonLatToHex(lon, lat, s) {
  const q = (Math.SQRT3 / 3 * lon - lat / 3) / s;
  const r = (2 / 3 * lat) / s;
  return axialRound(q, r);
}
function hexCorners(q, r, s) {
  const cx = s * (Math.SQRT3 * q + Math.SQRT3 / 2 * r);
  const cy = s * (1.5 * r);
  const out = [];
  for (let i = 0; i < 6; i++) {
    const ang = Math.PI / 180 * (60 * i - 30);
    out.push([cy + s * Math.sin(ang), cx + s * Math.cos(ang)]);
  }
  return out;
}
function buildHex(key, s) {
  const counts = {};
  ptsOf(key).forEach(function(p) {
    const qr = lonLatToHex(p.longitude, p.latitude, s);
    const id = qr[0] + ':' + qr[1];
    counts[id] = (counts[id] || 0) + 1;
  });
  const layers = [];
  Object.keys(counts).forEach(function(id) {
    const n = counts[id];
    const parts = id.split(':');
    const q = +parts[0], r = +parts[1];
    layers.push(L.polygon(hexCorners(q, r, s), {
      color: '#1c1917', weight: 0.7, fillColor: hexColor(n), fillOpacity: 0.75
    }).bindTooltip(n + ' C-101' + (n === 1 ? '' : 's')));
  });
  return layers;
}

const map = L.map('map', { zoomControl: true, maxZoom: 19, minZoom: 5 });
const imagery = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  { attribution: 'Esri', maxZoom: 19, maxNativeZoom: 19 }
).addTo(map);
const streets = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
  { attribution: 'Esri streets', maxZoom: 19, opacity: 0.85 }
);
L.geoJSON(COUNTIES, {
  style: { color: '#fdba74', weight: 1, fill: false, opacity: 0.85 }
}).addTo(map);

const hexLayer = L.layerGroup().addTo(map);
const wellLayer = L.layerGroup().addTo(map);
const cityLayer = L.layerGroup().addTo(map);
let activeKey = '30';

function syncView() {
  try {
    hexLayer.clearLayers();
    wellLayer.clearLayers();
    const z = map.getZoom();
    if (!Number.isFinite(z)) return;
    const pts = ptsOf(activeKey);
    if (z < PIN_ZOOM) {
      buildHex(activeKey, hexSize(z)).forEach(function(ly) { ly.addTo(hexLayer); });
    } else {
      pts.forEach(function(p) {
        if (!Number.isFinite(p.latitude) || !Number.isFinite(p.longitude)) return;
        L.circleMarker([p.latitude, p.longitude], {
          radius: 5, color: '#1c1917', weight: 1,
          fillColor: p.federal ? FED : FEE, fillOpacity: 0.95
        }).bindPopup(popupHtml(p)).addTo(wellLayer);
      });
    }
  } catch (err) {
    console.error(err);
  }
}
function refreshCities() {
  cityLayer.clearLayers();
  const b = map.getBounds().pad(0.05);
  CITIES.forEach(function(c) {
    if (!b.contains([c.latitude, c.longitude])) return;
    L.marker([c.latitude, c.longitude], {
      icon: L.divIcon({ className: 'city-label', html: c.name, iconSize: [0, 0], iconAnchor: [-8, 8] }),
      interactive: false, zIndexOffset: -200
    }).addTo(cityLayer);
  });
}
function fitCluster() {
  const b = clusterBounds(ptsOf(activeKey));
  if (b) map.fitBounds(b, { maxZoom: 12 });
  else map.setView([32.5, -104.0], 8);
}
function fitAll() {
  const b = allBounds(ptsOf(activeKey));
  if (b) map.fitBounds(b, { padding: [40, 40], maxZoom: 10 });
}

const dummy30 = L.layerGroup();
const dummy90 = L.layerGroup();
const dummy180 = L.layerGroup();
dummy30.addTo(map);
L.control.layers(
  { '30-day': dummy30, '90-day': dummy90, '180-day': dummy180 },
  { 'Street labels': streets },
  { collapsed: false }
).addTo(map);

const FitCtl = L.Control.extend({
  options: { position: 'topleft' },
  onAdd: function () {
    const div = L.DomUtil.create('div', 'leaflet-bar fit-ctl');
    const a = L.DomUtil.create('a', '', div);
    a.href = '#'; a.title = 'Frame the activity cluster'; a.textContent = 'Cluster';
    const b = L.DomUtil.create('a', '', div);
    b.href = '#'; b.title = 'Fit every located well'; b.textContent = 'All NM';
    L.DomEvent.on(a, 'click', function (e) { L.DomEvent.stop(e); fitCluster(); });
    L.DomEvent.on(b, 'click', function (e) { L.DomEvent.stop(e); fitAll(); });
    return div;
  }
});
map.addControl(new FitCtl());

const Legend = L.Control.extend({
  options: { position: 'bottomright' },
  onAdd: function () {
    const d = L.DomUtil.create('div', 'legend');
    d.innerHTML =
      '<div class=t>C-101 approvals</div>' +
      '<div class=row><span class=sw style="background:#38bdf8"></span>1 / hex</div>' +
      '<div class=row><span class=sw style="background:#fbbf24"></span>2–4</div>' +
      '<div class=row><span class=sw style="background:#f97316"></span>5–9</div>' +
      '<div class=row><span class=sw style="background:#ef4444"></span>10–19</div>' +
      '<div class=row><span class=sw style="background:#7f1d1d"></span>20+</div>' +
      '<div class=t style="margin-top:8px">Wells (zoom ≥11)</div>' +
      '<div class=row><span class=dot style="background:#f59e0b"></span>Federal / Indian</div>' +
      '<div class=row><span class=dot style="background:#38bdf8"></span>State / Private</div>' +
      '<div style="margin-top:6px;opacity:.8">Hexes hide when wells appear.</div>';
    return d;
  }
});
map.addControl(new Legend());

map.on('zoomend', syncView);
map.on('moveend', refreshCities);
map.on('baselayerchange', function (e) {
  if (e.name.indexOf('30') === 0) activeKey = '30';
  else if (e.name.indexOf('90') === 0) activeKey = '90';
  else activeKey = '180';
  syncView();
  const b = clusterBounds(ptsOf(activeKey));
  if (b) map.fitBounds(b, { maxZoom: 12 });
});

map.setView([32.5, -104.0], 8);
map.whenReady(function () {
  const b = clusterBounds(ptsOf('30'));
  if (b && b.isValid()) map.fitBounds(b, { maxZoom: 12 });
  syncView();
  refreshCities();
  setTimeout(function () { window.__pwReady = true; }, 2000);
});
setTimeout(function () { window.__pwReady = true; }, 8000);
