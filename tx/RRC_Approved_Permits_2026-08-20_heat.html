const PIN_ZOOM = 11;
const FED = '#f59e0b';
const FEE = '#38bdf8';
const HEX_FILL = {
  1: '#38bdf8',
  2: '#fde047',
  5: '#fb923c',
  10: '#f97316',
  20: '#ef4444',
  30: '#b91c1c',

};
window.__pwReady = false;

function hexColor(n) {
  if (n >= 40) return HEX_FILL[40];
  if (n >= 30) return HEX_FILL[30];
  if (n >= 20) return HEX_FILL[20];
  if (n >= 10) return HEX_FILL[10];
  if (n >= 5) return HEX_FILL[5];
  if (n >= 2) return HEX_FILL[2];
  return HEX_FILL[1];
}
function ptsOf(key) { return (DATA[key] && DATA[key].points) || []; }
function quantile(arr, q) {
  const a = arr.slice().sort(function(x, y) { return x - y; });
  if (!a.length) return 0;
  const i = (a.length - 1) * q;
  const lo = Math.floor(i), hi = Math.ceil(i);
  if (lo === hi) return a[lo];
  return a[lo] * (hi - i) + a[hi] * (i - lo);
}
function clusterBounds(pts) {
  if (!pts.length) return null;
  if (pts.length < 8) {
    return L.latLngBounds(pts.map(function(p) { return [p.latitude, p.longitude]; })).pad(0.2);
  }
  const lats = pts.map(function(p) { return p.latitude; });
  const lons = pts.map(function(p) { return p.longitude; });
  return L.latLngBounds(
    [quantile(lats, 0.02), quantile(lons, 0.02)],
    [quantile(lats, 0.98), quantile(lons, 0.98)]
  ).pad(0.12);
}
function allBounds(pts) {
  if (!pts.length) return null;
  return L.latLngBounds(pts.map(function(p) { return [p.latitude, p.longitude]; })).pad(0.08);
}
function popupHtml(p) {
  const name = p.well_name || p.api || 'Well';
  const kind = p.federal ? 'Horizontal' : (p.land || 'Vertical / other');
  return '<div><b>' + name + '</b>'
    + (p.operator ? '<div class=op>' + p.operator + '</div>' : '')
    + '<div>' + kind + (p.county ? ' · ' + p.county + ' County' : '') + '</div>'
    + (p.approved ? '<div>Approved ' + p.approved + '</div>' : '')
    + (p.api ? '<div>Permit ' + p.api + '</div>' : '')
    + '<div>' + p.latitude.toFixed(5) + ', ' + p.longitude.toFixed(5) + '</div></div>';
}
function hexSize(z) {
  if (!Number.isFinite(z)) return 0.045;
  if (z <= 6) return 0.12;
  if (z <= 8) return 0.07;
  return 0.04;
}
function axialRound(q, r) {
  let x = q, z = r, y = -x - z;
  let rx = Math.round(x), ry = Math.round(y), rz = Math.round(z);
  const xd = Math.abs(rx - x), yd = Math.abs(ry - y), zd = Math.abs(rz - z);
  if (xd > yd && xd > zd) rx = -ry - rz;
  else if (yd > zd) ry = -rx - rz;
  else rz = -rx - ry;
  return [rx, rz];
}
function lonLatToHex(lon, lat, s) {
  const rt3 = Math.sqrt(3);
  const q = (rt3 / 3 * lon - lat / 3) / s;
  const r = (2 / 3 * lat) / s;
  return axialRound(q, r);
}
function hexCorners(q, r, s) {
  const rt3 = Math.sqrt(3);
  const cx = s * (rt3 * q + rt3 / 2 * r);
  const cy = s * (1.5 * r);
  const out = [];
  for (let i = 0; i < 6; i++) {
    const ang = Math.PI / 180 * (60 * i - 30);
    out.push([cy + s * Math.sin(ang), cx + s * Math.cos(ang)]);
  }
  return out;
}
function buildHex(key, s) {
  const counts = {};
  ptsOf(key).forEach(function(p) {
    const qr = lonLatToHex(p.longitude, p.latitude, s);
    const id = qr[0] + ':' + qr[1];
    counts[id] = (counts[id] || 0) + 1;
  });
  const layers = [];
  Object.keys(counts).forEach(function(id) {
    const n = counts[id];
    const parts = id.split(':');
    const q = +parts[0], r = +parts[1];
    layers.push(L.polygon(hexCorners(q, r, s), {
      color: '#fff7ed', weight: 1, fillColor: hexColor(n), fillOpacity: 0.55,
      interactive: true
    }).bindTooltip(n + ' permit' + (n === 1 ? '' : 's')));
  });
  return layers;
}

const hexLayer = L.layerGroup().addTo(map);
const wellLayer = L.layerGroup().addTo(map);
const cityLayer = L.layerGroup().addTo(map);
let activeKey = '30';

function syncView() {
  try {
    hexLayer.clearLayers();
    wellLayer.clearLayers();
    const z = map.getZoom();
    const s = hexSize(Number.isFinite(z) ? z : 8);
    buildHex(activeKey, s).forEach(function(ly) { ly.addTo(hexLayer); });
    const r = z >= 12 ? 6 : z >= 10 ? 5 : 4;
    ptsOf(activeKey).forEach(function(p) {
      if (!Number.isFinite(p.latitude) || !Number.isFinite(p.longitude)) return;
      L.circleMarker([p.latitude, p.longitude], {
        radius: r, color: '#1c1917', weight: 1.2,
        fillColor: p.federal ? FED : FEE, fillOpacity: 0.95,
        pane: 'markerPane'
      }).bindPopup(popupHtml(p)).addTo(wellLayer);
    });
  } catch (err) {
    console.error(err);
  }
}
function refreshCities() {
  cityLayer.clearLayers();
  const b = map.getBounds().pad(0.05);
  CITIES.forEach(function(c) {
    if (!b.contains([c.latitude, c.longitude])) return;
    L.marker([c.latitude, c.longitude], {
      icon: L.divIcon({ className: 'city-label', html: c.name, iconSize: [0, 0], iconAnchor: [-8, 8] }),
      interactive: false, zIndexOffset: -200

  });
}
function fitCluster() {
  const b = clusterBounds(ptsOf(activeKey));
  if (b) map.fitBounds(b, { maxZoom: 10 });
  else map.setView([31.7, -102.2], 7);
}
function fitAll() {
  const b = allBounds(ptsOf(activeKey));
  if (b) map.fitBounds(b, { padding: [40, 40], maxZoom: 10 });

      '<div class=row><span class=sw style="background:#fde047"></span>2–4</div>' +
      '<div class=row><span class=sw style="background:#fb923c"></span>5–9</div>' +
      '<div class=row><span class=sw style="background:#f97316"></span>10–19</div>' +
      '<div class=row><span class=sw style="background:#ef4444"></span>20–29</div>' +
      '<div class=row><span class=sw style="background:#b91c1c"></span>30–39</div>' +
      '<div class=row><span class=sw style="background:#450a0a"></span>40+</div>' +
      '<div class=t style="margin-top:8px">Wells</div>' +
      '<div class=row><span class=dot style="background:#f59e0b"></span>Horizontal</div>' +
      '<div class=row><span class=dot style="background:#38bdf8"></span>Vertical / other</div>' +
      '<div style="margin-top:6px;opacity:.8">Hex = count; dots = wells (both on).</div>';
    return d;
  }
});
map.addControl(new Legend());

map.on('zoomend', syncView);
map.on('moveend', refreshCities);
map.on('baselayerchange', function (e) {
  if (e.name.indexOf('30') === 0) activeKey = '30';
  else if (e.name.indexOf('90') === 0) activeKey = '90';
  else activeKey = '180';
  syncView();
  const b = clusterBounds(ptsOf(activeKey));
  if (b) map.fitBounds(b, { maxZoom: 10 });
});

map.setView([31.7, -102.2], 7);
map.whenReady(function () {
  const b = clusterBounds(ptsOf('30'));
  if (b && b.isValid()) map.fitBounds(b, { maxZoom: 10 });
  syncView();
  refreshCities();
  setTimeout(function () { window.__pwReady = true; }, 2000);
});
setTimeout(function () { window.__pwReady = true; }, 8000);
</script>
</body>
</html>
